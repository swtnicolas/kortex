name: Release

on:
  push:
    tags: ["linux-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsystemd-dev
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Test
        run: bash scripts/test.sh

      - name: Package
        run: bash scripts/package.sh

      - name: Check glibc requirement
        run: |
          needed=$(objdump -T service/target/release/kortex-service | grep -v ' w ' | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -1)
          echo "Requires glibc $needed"
          [ "$(printf '%s\n' "$needed" 2.34 | sort -V | tail -1)" = 2.34 ]

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/kortex-install.sh --title "Kortex para KDE Plasma ${GITHUB_REF_NAME#linux-v}" --generate-notes
